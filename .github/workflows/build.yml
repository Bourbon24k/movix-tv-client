name: build

on:
  push:
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v2
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Build APK
        run: ./build.sh
